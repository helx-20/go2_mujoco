# Dynamic terrain configuration for interactive use. Additional parameters such as friction will be added here.
terrain_action:
  terrain_types: ["bump"]

  # bump center forward distance range (m)
  min_forward_dist: 0.1
  max_forward_dist: 0.8

  # bump lateral offset range (m)
  max_lateral: 0.30

  # bump radius range (m)
  radius_min: 0.1
  radius_max: 0.5

  # bump max height (m)
  max_bump_height: 0.10

  # no-modification radius around robot (m)
  no_change_radius: 0.45

  terrain_decimation: 20


# Initialize plum blossom pile params, can be used for xxx  # TODO
plum_blossom:
  foot_clearance_m: 0.05


# Visualization config
visualization:
  render: False
  lock_camera: True
  realtime_sim: False

logging:
  # If true, info includes per-substep Go2 rollout traces (large payload).
  enable_trace: True

# Reward and event config
event_and_reward:
  # failure event switch (can be disabled)
  failure_flags:
    fallen: True
    collided: False
    base_collision: True
    thigh_collision: True
    stuck: True

  # reward
  # ===== Fallen =====
  fall_height_threshold: 0.15
  fall_angle_threshold: 1.3
  fall_reward: 5.0

  # ===== Collision =====
  collision_force_threshold: 80.0
  collision_reward: 0.0
  base_collision_reward: 6.0
  thigh_collision_reward: 2.0

  # ===== Instability =====
  tilt_reward_scale: 0.0

  # ===== Speed Penalty =====
  target_speed: 1.0
  speed_reward_scale: 0
  stuck_speed_threshold: 0.05
  stuck_reward: 2.0

  repeat_reward: False
  # positive episodic success reward given when episode ends by time-limit (non-failure)
  success_reward: 1.0


# Termination conditions
termination:
  terminate_on_fall: False
  terminate_on_base_collision: False
  terminate_on_stuck: True
  terminate_on_terrain_edge: True
  terrain_edge_margin: 1.0


# Training observation config
observation:
  include_last_action: False
  include_foot_contacts: False
  contact_force_threshold: 1.0
  local_height_map:
    enabled: true
    size_m: 0.8
    resolution_m: 0.2

